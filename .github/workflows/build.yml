name: Build Release APK
on: [push]
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 新增：显式设置 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # 使用 Eclipse Temurin 发行版
          java-version: '17'      # 明确指定 Java 17

      - name: Enable Swap Space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Enable Swap Space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev python3-pip python3-setuptools openjdk-11-jdk unzip automake autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake apksigner
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Create Keystore
        working-directory: ./calapp
        run: |
          keytool -genkeypair -v -keystore my-release-key.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 44521667 -keypass 44521667 -dname "CN=CalendarToolbox, OU=Dev, O=Personal, L=City, S=State, C=CN"

      - name: Clean .buildozer Cache
        working-directory: ./calapp
        run: |
          rm -rf .buildozer

      - name: Build Release APK
        working-directory: ./calapp
        # 关键修改：去掉重试循环，如果失败直接报错退出，不掩饰问题
        run: |
          buildozer android release

      # 关键新增：在上传前，打印出 bin 目录里的所有文件，看看它到底生成了什么！
      - name: Debug - List built files
        working-directory: ./calapp
        run: |
          echo "===== 查看 calapp/bin/ 目录下生成了什么文件 ====="
          ls -lh bin/
          echo "===== 查看 calapp/bin/ 下的 APK 文件 ====="
          find bin/ -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cal-toolbox-release-apk
          # 关键修改：使用绝对明确的路径，如果找不到直接报错提示
          path: calapp/bin/*.apk
          if-no-files-found: error
