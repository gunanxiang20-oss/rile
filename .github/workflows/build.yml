name: Build Release APK
on: [push]
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Enable Swap Space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev python3-pip python3-setuptools openjdk-11-jdk unzip automake autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake apksigner
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Create Keystore
        working-directory: ./calapp
        run: |
          keytool -genkeypair -v -keystore my-release-key.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 44521667 -keypass 44521667 -dname "CN=CalendarToolbox, OU=Dev, O=Personal, L=City, S=State, C=CN"

      # 新增：在构建前清理可能残留的缓存，避免调用旧的错误编译产物
      - name: Clean .buildozer Cache
        working-directory: ./calapp
        run: |
          rm -rf .buildozer

      - name: Build Release APK
        working-directory: ./calapp
        run: |
          for i in 1 2 3; do
            echo "===== 尝试构建 第 $i 次 ====="
            timeout 30m bash -c "yes | buildozer android release" && break
            echo "构建失败，30秒后重试..."
            sleep 30
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cal-toolbox-release-apk
          path: bin/*.apk
